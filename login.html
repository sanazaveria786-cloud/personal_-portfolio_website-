<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - My Portfolio</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <section>

        <h1>User Login</h1>


        <form>

            <label for="loginUsername">
                Username:
            </label>

            <input
                type="text"
                id="loginUsername"
            >


            <label for="loginPassword">
                Password:
            </label>

            <input
                type="password"
                id="loginPassword"
            >


            <button
                type="button"
                onclick="login()"
            >
                Login
            </button>

        </form>


        <p>
            New user?
            <a href="signup.html">Sign Up</a>
        </p>


        <p>
            <a href="index.html">
                Back to Portfolio
            </a>
        </p>

    </section>


    <script src="script.js"></script>

</body>

</html>
