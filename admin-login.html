<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - My Portfolio</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <section>

        <h1>Admin Login</h1>


        <form>

            <label for="adminUsername">
                Admin Username:
            </label>

            <input
                type="text"
                id="adminUsername"
            >


            <label for="adminPassword">
                Admin Password:
            </label>

            <input
                type="password"
                id="adminPassword"
            >


            <button
                type="button"
                onclick="adminLogin()"
            >
                Admin Login
            </button>

        </form>


        <p>
            <a href="index.html">
                Back to Portfolio
            </a>
        </p>

    </section>


    <script src="script.js"></script>

</body>

</html>
