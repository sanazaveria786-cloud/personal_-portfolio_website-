<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - My Portfolio</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <section>

        <h1>Create Your Account</h1>


        <form>

            <label for="username">
                Username:
            </label>

            <input
                type="text"
                id="username"
            >


            <label for="password">
                Password:
            </label>

            <input
                type="password"
                id="password"
            >


            <button
                type="button"
                onclick="signup()"
            >
                Sign Up
            </button>

        </form>


        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>


        <p>
            <a href="index.html">
                Back to Portfolio
            </a>
        </p>

    </section>


    <script src="script.js"></script>

</body>

</html>
